[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "1.0"
description = "Потоковый анализатор файлов событий (лабораторная работа 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
streamstats = "streamstats.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# чтобы pytest видел пакет streamstats из папки src без установки
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
